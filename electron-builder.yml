# electron-builder 打包配置
appId: com.dailynotebook.app
productName: 每日记事本
directories:
  output: release-electron
  buildResources: build
files:
  - dist/**
  - electron/**
  - package.json
# 窗口图标放 asar 外，主进程经 process.resourcesPath 读取
extraResources:
  - from: build/icon.png
    to: icon.png
# 产物文件名用 ASCII，避免 GitHub Releases 链接的中文转义问题
artifactName: DailyNotebook-${version}-${os}-${arch}.${ext}
publish:
  provider: github
  owner: Southrain-memory
  repo: DN-notebook
  # 默认是 draft（草稿，需手动发布）；改成 release 后推标签即自动正式发布
  releaseType: release
deb:
  # 自定义安装后脚本：无条件设置 chrome-sandbox 的 setuid 位（Ubuntu 24.04 AppArmor 限制 userns，
  # 默认脚本的 userns 探测会误判，见 build/after-install.sh 内注释）
  afterInstall: build/after-install.sh
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: 每日记事本
mac:
  target:
    - dmg
  category: public.app-category.productivity
  icon: build/icon.png
linux:
  target:
    - deb
  category: Utility
  icon: build/icon.png
  maintainer: Southrain-memory
  # 窗口类名（WM_CLASS）固定为 ASCII，任务栏/启动器靠它匹配 .desktop；
  # 中文 productName 生成的类名部分面板无法识别（图标退化、名称乱码）
  executableArgs:
    - --class=daily-notebook
  desktop:
    Name: 每日记事本
    StartupWMClass: daily-notebook
